<svg direction="ltr" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img"><rect width="1100" height="560" fill="#F4EBDD"/><text x="40" y="40" text-anchor="start" font-family="Cairo,'Noto Sans Arabic',sans-serif" font-size="17" font-weight="600" fill="#6B5C50">نموذج الكشك · ≈ 20 م² · 5 م × 4 م · طلبات خارجية + 6–8 مقاعد/طاولات وقوف</text><rect x="60" y="80" width="500" height="400" fill="#fffaf1" stroke="#1B120D" stroke-width="5"/><rect x="65" y="85" width="160" height="160" fill="#e7dcc6" stroke="#1B120D" stroke-width="2"/><text x="145" y="163" text-anchor="middle" font-family="Cairo,'Noto Sans Arabic',sans-serif" font-size="16" font-weight="600" fill="#1B120D">مخزن جاف</text><text x="145" y="180" text-anchor="middle" font-family="Cairo,'Noto Sans Arabic',sans-serif" font-size="13" font-weight="600" fill="#6B5C50">+ غرفة تبريد</text><rect x="230" y="85" width="325" height="50" fill="#ddd" stroke="#1B120D" stroke-width="2"/><text x="392.5" y="115" text-anchor="middle" font-family="Cairo,'Noto Sans Arabic',sans-serif" font-size="16" font-weight="600" fill="#1B120D">كاونتر خلفي · ثلاجات · ثلج</text><rect x="240" y="210" width="295" height="90" fill="#1B120D"/><text x="390" y="248" text-anchor="middle" font-family="Cairo,'Noto Sans Arabic',sans-serif" font-size="16" font-weight="600" fill="#F4EBDD">بار الإسبريسو (مجموعتان) · الكاشير · المطاحن</text><rect x="240" y="306" width="140" height="70" fill="#C9873A" stroke="#1B120D" stroke-width="2"/><text x="310" y="339" text-anchor="middle" font-family="Cairo,'Noto Sans Arabic',sans-serif" font-size="16" font-weight="600" fill="#1B120D">معجنات</text><text x="310" y="356" text-anchor="middle" font-family="Cairo,'Noto Sans Arabic',sans-serif" font-size="13" font-weight="600" fill="#6B5C50">عرض</text><rect x="65" y="340" width="150" height="130" fill="none" stroke="#1B120D" stroke-dasharray="5 4"/><text x="140" y="410" text-anchor="middle" font-family="Cairo,'Noto Sans Arabic',sans-serif" font-size="13" font-weight="600" fill="#1B120D">الخدمة</text><text x="140" y="426" text-anchor="middle" font-family="Cairo,'Noto Sans Arabic',sans-serif" font-size="13" font-weight="600" fill="#1B120D">والطابور</text><rect x="400" y="476" width="140" height="8" fill="#A4492B"/><text x="310" y="510" text-anchor="middle" font-family="Cairo,'Noto Sans Arabic',sans-serif" font-size="14" font-weight="600" fill="#A4492B">نافذة طلب / واجهة مفتوحة</text><circle cx="190" cy="570" r="14" fill="#D9C6A8" stroke="#1B120D" stroke-width="1.5"/><circle cx="167" cy="570" r="6" fill="#A4492B"/><circle cx="213" cy="570" r="6" fill="#A4492B"/><circle cx="300" cy="570" r="14" fill="#D9C6A8" stroke="#1B120D" stroke-width="1.5"/><circle cx="277" cy="570" r="6" fill="#A4492B"/><circle cx="323" cy="570" r="6" fill="#A4492B"/><circle cx="410" cy="570" r="14" fill="#D9C6A8" stroke="#1B120D" stroke-width="1.5"/><circle cx="387" cy="570" r="6" fill="#A4492B"/><circle cx="433" cy="570" r="6" fill="#A4492B"/><circle cx="520" cy="570" r="14" fill="#D9C6A8" stroke="#1B120D" stroke-width="1.5"/><circle cx="497" cy="570" r="6" fill="#A4492B"/><circle cx="543" cy="570" r="6" fill="#A4492B"/><text x="310" y="610" text-anchor="middle" font-family="Cairo,'Noto Sans Arabic',sans-serif" font-size="13" font-weight="600" fill="#6B5C50">طاولات وقوف خارجية (حسب التصريح)</text><text x="1060" y="140" text-anchor="end" font-family="Cairo,'Noto Sans Arabic',sans-serif" font-size="16" font-weight="600" fill="#6B5C50">تشغيل الكشك</text><text x="1060" y="170" text-anchor="end" font-family="Cairo,'Noto Sans Arabic',sans-serif" font-size="16" font-weight="600" fill="#1B120D">باريستا اثنان في الوردية وقت الذروة، وواحد خارجها</text><text x="1060" y="198" text-anchor="end" font-family="Cairo,'Noto Sans Arabic',sans-serif" font-size="16" font-weight="600" fill="#1B120D">المنيو: إسبريسو + حليب + باردة + 6 مشروبات مميزة +</text><text x="1060" y="218" text-anchor="end" font-family="Cairo,'Noto Sans Arabic',sans-serif" font-size="16" font-weight="600" fill="#1B120D">معجنات جاهزة (بلا خَبز في الموقع)</text><text x="1060" y="270" text-anchor="end" font-family="Cairo,'Noto Sans Arabic',sans-serif" font-size="16" font-weight="600" fill="#1B120D">المعدات (تقديري): ماكينة مجموعتين، مطحنتان،</text><text x="1060" y="290" text-anchor="end" font-family="Cairo,'Noto Sans Arabic',sans-serif" font-size="16" font-weight="600" fill="#1B120D">ثلاجتان تحت الكاونتر، ماكينة ثلج، ثلاجة عرض،</text><text x="1060" y="310" text-anchor="end" font-family="Cairo,'Noto Sans Arabic',sans-serif" font-size="16" font-weight="600" fill="#1B120D">كاشير، فلترة مياه</text><text x="1060" y="380" text-anchor="end" font-family="Cairo,'Noto Sans Arabic',sans-serif" font-size="14" font-weight="600" fill="#6B5C50">مخطط توضيحي فقط، ويُراجَع مع المهندس والمالك.</text></svg>